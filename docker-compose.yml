name: autob2b

services:
  app:
    build: .
    image: autob2b:reviewed
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      HOST: 127.0.0.1
      PORT: "10000"
      COOKIE_SECURE: "1"
      TRUST_PROXY: loopback
      ENFORCE_LOOPBACK: "1"
      REQUIRE_ADMIN: "1"
      NODE_ENV: production
      DB_FILE: /data/autob2b.sqlite
      UPLOAD_DIR: /uploads
      SECRETS_FILE: /secrets/secrets.env
    volumes:
      - /srv/autob2b/data:/data
      - /srv/autob2b/uploads:/uploads
      - /srv/autob2b/secrets.env:/secrets/secrets.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
